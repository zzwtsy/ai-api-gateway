name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 不带 v 前缀的项目 SemVer
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: 验证并发布 GHCR 与 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 验证版本、main、Release Commit、CI 与 Tag
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main --tags
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          test "$VERSION" = "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          pnpm verify:project-version
          test "$(git log -1 --pretty=%s)" = "chore(release): v$VERSION"

          successful_ci_runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")] | length')"
          test "$successful_ci_runs" -ge 1

          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{}")" = "$GITHUB_SHA"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 生成并校验发布资产
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm release:assets -- "$VERSION"

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.3.0
      - name: 验证 GHCR 镜像标签归属
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/release/verify-image-ownership.ts
      - name: 计算镜像标签
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
      - name: 构建并推送多架构镜像
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: 证明镜像来源
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: 创建 Annotated Tag
        if: steps.preflight.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" \
            -f message="AI API Gateway $TAG" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$tag_object"

      - name: 创建或续跑 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.preflight.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_dir=".artifacts/release/$VERSION"
          prerelease=false
          case "$VERSION" in
            *-*) prerelease=true ;;
          esac

          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="AI API Gateway $TAG" \
              -F prerelease="$prerelease" \
              -F body="@$release_dir/RELEASE_NOTES.md"
          fi

          gh release upload "$TAG" --clobber \
            "$release_dir/ai-api-gateway-v$VERSION.tar.gz" \
            "$release_dir/AI_API_GATEWAY_SPEC.md" \
            "$release_dir/AI_API_GATEWAY_ENGINEERING_SPEC.md" \
            "$release_dir/AI_API_GATEWAY_FRONTEND_SPEC.md" \
            "$release_dir/RELEASE_NOTES.md" \
            "$release_dir/SHA256SUMS"
