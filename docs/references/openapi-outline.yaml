        accountId:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - api_key
            - bearer_token
            - custom_header_set
        maskedDisplay:
          type: string
        fingerprint:
          type: string
        status:
          type: string
          enum:
            - unverified
            - healthy
            - cooldown
            - auth_failed
            - unavailable
            - disabled
