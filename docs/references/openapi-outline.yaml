            required:
              - endpointId
              - enabled
              - priority
            properties:
              endpointId:
                type: string
              enabled:
                type: boolean
              priority:
                type: integer
              weight:
                type: integer
                minimum: 1
                default: 1
    CredentialResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
