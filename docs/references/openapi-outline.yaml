        endpointId:
          type: string
        modelDefinitionId:
          type:
            - string
            - "null"
        upstreamModelId:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/ModelBindingStatus"
        contextWindow:
          type:
            - integer
            - "null"
        maxOutputTokens:
          type:
            - integer
            - "null"
        inputModalities:
          type: array
          items:
            type: string
        capabilities:
          type: object
          additionalProperties: true
        fieldSources:
          type: object
          additionalProperties:
            type: string
        version:
          type: integer
    ModelBindingPatchInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/ModelBindingStatus"
        modelDefinitionId:
          type:
            - string
            - "null"
        overrides:
          type: object
          additionalProperties: true
    ModelBindingResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ModelBinding"
    ModelBindingListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ModelBinding"
    ModelsDevMatchResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - candidates
              properties:
                candidates:
                  type: array
                  items:
                    type: object
                    required:
                      - providerId
                      - modelId
                      - confidence
                    properties:
                      providerId:
                        type: string
                      modelId:
                        type: string
                      confidence:
                        type: number
                        minimum: 0
                        maximum: 1
                      exact:
                        type: boolean
    ModelsDevStatusResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - never_synced
                    - healthy
                    - stale
                    - failed
                fetchedAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                contentHash:
                  type:
                    - string
                    - "null"
                lastError:
                  type:
                    - string
                    - "null"
    RouteScope:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - client
            - harness
            - global
        id:
          type:
            - string
            - "null"
    RouteMatcher:
      type: object
      required:
        - type
        - pattern
      properties:
        type:
          type: string
          enum:
            - exact
            - prefix
            - glob
            - regex
        pattern:
          type: string
          minLength: 1
    RequestPatch:
      type: object
      required:
        - location
        - path
        - mode
        - value
        - sequence
      properties:
        location:
          type: string
          enum:
            - header
            - query
            - body
        path:
          type: string
        mode:
          type: string
          enum:
            - default_if_absent
            - force
            - reject_on_conflict
        value: {}
        sequence:
          type: integer
          minimum: 1
    RouteTargetInput:
      type: object
      required:
        - sequence
        - endpointId
        - providerModelBindingId
        - accountSelectionMode
        - patches
      properties:
        sequence:
          type: integer
          minimum: 1
        endpointId:
          type: string
        providerModelBindingId:
          type: string
        accountSelectionMode:
          type: string
          enum:
            - automatic
            - account
            - credential_group
        accountSelectorId:
          type:
            - string
            - "null"
        requestTimeoutMs:
          type:
            - integer
            - "null"
          minimum: 1000
        patches:
          type: array
          items:
            $ref: "#/components/schemas/RequestPatch"
    RouteInput:
      type: object
      required:
        - name
        - scope
        - protocol
        - matcher
        - priority
        - enabled
        - maxGatewayAttempts
        - targets
      properties:
        name:
          type: string
        scope:
          $ref: "#/components/schemas/RouteScope"
        protocol:
          $ref: "#/components/schemas/Protocol"
        matcher:
          $ref: "#/components/schemas/RouteMatcher"
        priority:
          type: integer
        enabled:
          type: boolean
        maxGatewayAttempts:
          type: integer
          minimum: 1
          maximum: 5
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteTargetInput"
    Route:
      allOf:
        - $ref: "#/components/schemas/RouteInput"
        - type: object
          required:
            - id
            - version
          properties:
            id:
              type: string
            version:
              type: integer
            validationStatus:
              type: string
              enum:
                - valid
                - warning
                - invalid
    RouteResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Route"
    RouteListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Route"
    RouteValidationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - valid
                - errors
                - warnings
              properties:
                valid:
                  type: boolean
                errors:
                  type: array
                  items:
                    $ref: "#/components/schemas/ValidationIssue"
                warnings:
                  type: array
                  items:
                    $ref: "#/components/schemas/ValidationIssue"
    ValidationIssue:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type:
            - string
            - "null"
        details:
          type:
            - object
            - "null"
          additionalProperties: true
    RouteExplainInput:
      type: object
      required:
        - clientId
        - protocol
        - model
      properties:
        clientId:
          type: string
        protocol:
          $ref: "#/components/schemas/Protocol"
        model:
          type: string
    RouteExplainResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - selectedRoute
                - selectedTarget
                - rankedCandidates
                - rejectedCandidates
              properties:
                selectedRoute:
                  $ref: "#/components/schemas/Route"
                selectedTarget:
                  $ref: "#/components/schemas/RouteTargetInput"
                rankedCandidates:
                  type: array
                  items:
                    $ref: "#/components/schemas/RouteCandidate"
                rejectedCandidates:
                  type: array
                  items:
                    $ref: "#/components/schemas/RouteCandidate"
    RouteCandidate:
      type: object
      required:
        - routeId
        - rank
        - accepted
        - reasons
      properties:
        routeId:
          type: string
        rank:
          type: integer
        accepted:
          type: boolean
        reasons:
          type: array
          items:
            type: string
    RouteSnapshotResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - version
                - publishedAt
                - routeCount
              properties:
                version:
                  type: integer
                publishedAt:
                  type: string
                  format: date-time
                routeCount:
                  type: integer
                contentHash:
                  type: string
    Client:
      type: object
      required:
        - id
        - name
        - harnessProfile
        - allowedProtocols
        - status
        - version
      properties:
        id:
          type: string
        name:
          type: string
        harnessProfile:
          type: string
        allowedProtocols:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        allowedModelPatterns:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - disabled
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        version:
          type: integer
    ClientInput:
      type: object
      required:
        - name
        - harnessProfile
        - allowedProtocols
      properties:
        name:
          type: string
        harnessProfile:
          type: string
        allowedProtocols:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Protocol"
        allowedModelPatterns:
          type: array
          items:
            type: string
        dailyCostLimit:
          type:
            - number
            - "null"
          minimum: 0
        monthlyCostLimit:
          type:
            - number
            - "null"
          minimum: 0
    ClientPatchInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        allowedProtocols:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        allowedModelPatterns:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - disabled
        dailyCostLimit:
          type:
            - number
            - "null"
          minimum: 0
        monthlyCostLimit:
          type:
            - number
            - "null"
          minimum: 0
    ClientResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Client"
    ClientListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Client"
    ClientKeyCreatedResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          type: object
          required:
            - keyId
            - secret
            - prefix
            - last4
          properties:
            keyId:
              type: string
            secret:
              type: string
              writeOnly: true
            prefix:
              type: string
            last4:
              type: string
            expiresAt:
              type:
                - string
                - "null"
              format: date-time
        requestId:
          type: string
    ClientConfigurationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - harnessProfile
                - content
              properties:
                harnessProfile:
                  type: string
                mediaType:
                  type: string
                content:
                  type: string
                warnings:
                  type: array
                  items:
                    type: string
    RequestSummary:
      type: object
      required:
        - id
        - startedAt
        - clientId
        - protocol
        - requestedModel
        - status
        - attemptCount
      properties:
        id:
          type: string
        startedAt:
          type: string
          format: date-time
        clientId:
          type: string
        harnessProfile:
          type: string
        protocol:
          $ref: "#/components/schemas/Protocol"
        requestedModel:
          type: string
        resolvedModel:
          type:
            - string
            - "null"
        providerId:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - cancelled
            - stream_interrupted
        attemptCount:
          type: integer
        hasFallback:
          type: boolean
        ttftMs:
          type:
            - integer
            - "null"
        latencyMs:
          type:
            - integer
            - "null"
        totalTokens:
          type:
            - integer
            - "null"
        estimatedCost:
          type:
            - string
            - "null"
        costStatus:
          type: string
          enum:
            - reported
            - calculated
            - estimated
            - partial
            - unknown
    RequestListResponse:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/RequestSummary"
    RequestDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/RequestSummary"
                - type: object
                  properties:
                    routeId:
                      type:
                        - string
                        - "null"
                    routeSnapshot:
                      type:
                        - object
                        - "null"
                      additionalProperties: true
                    normalizedUsage:
                      type:
                        - object
                        - "null"
                      additionalProperties: true
                    cost:
                      type:
                        - object
                        - "null"
                      additionalProperties: true
                    error:
                      type:
                        - object
                        - "null"
                      additionalProperties: true
    Attempt:
      type: object
      required:
        - id
        - requestId
        - sequence
        - endpointId
        - credentialId
        - status
        - startedAt
      properties:
        id:
          type: string
        requestId:
          type: string
        sequence:
          type: integer
        routeTargetId:
          type: string
        endpointId:
          type: string
        accountId:
          type: string
        credentialId:
          type: string
        upstreamRequestModel:
          type: string
        upstreamReportedModel:
          type:
            - string
            - "null"
        upstreamRequestId:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - cancelled
            - stream_interrupted
        statusCode:
          type:
            - integer
            - "null"
        errorCategory:
          type:
            - string
            - "null"
        startedAt:
          type: string
          format: date-time
        firstByteAt:
          type:
            - string
            - "null"
          format: date-time
        firstSemanticOutputAt:
          type:
            - string
            - "null"
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        retryReason:
          type:
            - string
            - "null"
        normalizedUsage:
          type:
            - object
            - "null"
          additionalProperties: true
        pricingSnapshot:
          type:
            - object
            - "null"
          additionalProperties: true
    AttemptListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Attempt"
    TimelineResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                required:
                  - at
                  - type
                  - label
                properties:
                  at:
                    type: string
                    format: date-time
                  type:
                    type: string
                  label:
                    type: string
                  details:
                    type:
                      - object
                      - "null"
                    additionalProperties: true
    RawPayloadResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - mode
                - redacted
                - truncated
                - content
              properties:
                mode:
                  type: string
                  enum:
                    - full
                    - truncated
                    - metadata_only
                    - disabled
                redacted:
                  type: boolean
                truncated:
                  type: boolean
                content: {}
    AnalyticsMetric:
      type: string
      enum:
        - request_count
        - tokens
        - cost
        - request_error_rate
        - attempt_error_rate
        - fallback_rate
        - rate_limit_rate
        - ttft
        - latency
    RateMetric:
      type: object
      required:
        - metric
        - numerator
        - denominator
        - value
      properties:
        metric:
          type: string
        numerator:
          type: integer
        denominator:
          type: integer
        value:
          type: number
    AnalyticsSummaryResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - requestCount
                - tokenCount
                - costs
                - requestErrorRate
                - attemptErrorRate
                - fallbackRate
              properties:
                requestCount:
                  type: integer
                tokenCount:
                  type: integer
                costs:
                  type: object
                  properties:
                    apiEquivalent:
                      type:
                        - string
                        - "null"
                    estimatedBilled:
                      type:
                        - string
                        - "null"
                    reported:
                      type:
                        - string
                        - "null"
                    unknownAttemptCount:
                      type: integer
                requestErrorRate:
                  $ref: "#/components/schemas/RateMetric"
                attemptErrorRate:
                  $ref: "#/components/schemas/RateMetric"
                fallbackRate:
                  $ref: "#/components/schemas/RateMetric"
                p95TtftMs:
                  type:
                    - number
                    - "null"
                p95LatencyMs:
                  type:
                    - number
                    - "null"
    TimeseriesResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - metric
                - interval
                - points
              properties:
                metric:
                  $ref: "#/components/schemas/AnalyticsMetric"
                interval:
                  type: string
                points:
                  type: array
                  items:
                    type: object
                    required:
                      - at
                      - value
                    properties:
                      at:
                        type: string
                        format: date-time
                      value:
                        type:
                          - number
                          - "null"
                      numerator:
                        type:
                          - integer
                          - "null"
                      denominator:
                        type:
                          - integer
                          - "null"
    BreakdownResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - metric
                - groupBy
                - rows
              properties:
                metric:
                  $ref: "#/components/schemas/AnalyticsMetric"
                groupBy:
                  type: string
                rows:
                  type: array
                  items:
                    type: object
                    required:
                      - key
                      - label
                      - value
                    properties:
                      key:
                        type: string
                      label:
                        type: string
                      value:
                        type:
                          - number
                          - "null"
                      numerator:
                        type:
                          - integer
                          - "null"
                      denominator:
                        type:
                          - integer
                          - "null"
    SettingsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    LoggingSettingsInput:
      type: object
      properties:
        requestPayloadMode:
          type: string
          enum:
            - full
            - truncated
            - metadata_only
            - disabled
        responsePayloadMode:
          type: string
          enum:
            - full
            - truncated
            - metadata_only
            - disabled
        maxPayloadBytes:
          type: integer
          minimum: 0
        retentionDays:
          type: integer
          minimum: 1
        redactHeaders:
          type: array
          items:
            type: string
