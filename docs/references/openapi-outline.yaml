          type: string
        billingMode:
          type: string
          enum:
            - metered
            - subscription
            - free
            - custom
            - unknown
        billingPlanName:
          type:
            - string
            - "null"
        currency:
          type:
            - string
            - "null"
    AccountPatchInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        billingMode:
          type: string
          enum:
            - metered
            - subscription
            - free
            - custom
            - unknown
        billingPlanName:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - active
            - disabled
    AccountResponse:
