                result:
                  type: object
                  required:
                    - success
                  properties:
                    success:
                      type: boolean
                    statusCode:
                      type:
                        - integer
                        - "null"
                    latencyMs:
                      type:
                        - integer
                        - "null"
                    message:
                      type:
                        - string
                        - "null"
